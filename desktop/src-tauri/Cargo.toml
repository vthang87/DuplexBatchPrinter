[package]
name = "desktop"
version = "0.1.0"
description = "PDF Duplex Batch Printer — cross-platform manual duplex batch printing"
authors = ["vthang87"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
lopdf = "0.47.0"
dirs = "7.0.0"
once_cell = "1.21.4"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-fs = "2.7.1"
regex = "1.13.1"
printpdf = { version = "0.7.0", features = ["embedded_images"] }
image = "0.24"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
